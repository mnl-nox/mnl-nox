name: Site quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate index.html
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Dynamic profile widgets and anti-bot protected social sites are
          # not reliable CI targets. First-party and ordinary external links
          # remain checked.
          args: >-
            --verbose
            --no-progress
            --exclude 'https://(github-profile-trophy\.vercel\.app|github-readme-stats\.vercel\.app|github-readme-activity-graph\.vercel\.app|streak-stats\.demolab\.com|www\.linkedin\.com)/.*'
            README.md index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
