<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Underground core pulse</title><desc id="desc">A minimal CPU core with a slowly pulsing terminal-green orbit and red signal markers.</desc>
<rect x="1" y="1" width="318" height="318" rx="18" fill="#080808" stroke="#2b2b2b"/><g stroke="#00ff9c" stroke-width="2"><path d="M100 35v24M160 35v24M220 35v24M100 261v24M160 261v24M220 261v24M35 100h24M35 160h24M35 220h24M261 100h24M261 160h24M261 220h24"/></g>
<rect x="66" y="66" width="188" height="188" rx="14" fill="#0b0b0b" stroke="#ff2b2b" stroke-width="2"/><rect x="81" y="81" width="158" height="158" rx="9" fill="none" stroke="#333"/>
<circle cx="160" cy="160" r="64" fill="none" stroke="#00ff9c" stroke-width="2" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="18s" repeatCount="indefinite"/></circle>
<path d="M160 106C139 106 128 122 128 143L117 165l14 2c-1 17 10 29 29 29s30-12 29-29l14-10-13-14C190 122 181 106 160 106Z" fill="#00ff9c" fill-opacity=".14" stroke="#00ff9c" stroke-width="2"/><ellipse cx="148" cy="145" rx="4" ry="6" fill="#00ff9c"/><ellipse cx="173" cy="145" rx="4" ry="6" fill="#00ff9c"/><path d="M150 164q10 7 20 0" fill="none" stroke="#ff2b2b" stroke-width="2" stroke-linecap="round"/>
<circle cx="160" cy="160" r="83" fill="none" stroke="#00ff9c" stroke-width="1" opacity=".5"><animate attributeName="r" values="78;91;78" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".15;.55;.15" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="244" cy="160" r="4" fill="#ff2b2b"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="160" y="294" text-anchor="middle" fill="#777" font-family="monospace" font-size="11" letter-spacing="3">CPU CORE // ACTIVE</text>
</svg>