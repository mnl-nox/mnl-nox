<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">MNL-NOX // underground systems</title>
<desc id="desc">Minimal underground terminal banner with a near-black grid, crimson signal paths, terminal-green highlights, and monospaced typography.</desc>
<defs>
