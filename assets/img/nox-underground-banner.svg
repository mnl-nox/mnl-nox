<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">MNL-NOX // underground systems</title>
<desc id="desc">Pastel Ghost inspired underground technology banner with a violet night sky, spectral moon, terminal typography and abstract network traces.</desc>
