<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
<title id="title">MNL-NOX — Systems and Software</title>
<desc id="desc">Minimal dark editorial banner with a violet eclipse, fine technical grid and restrained lavender typography.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0a13"/>
    <stop offset=".58" stop-color="#14111f"/>
    <stop offset="1" stop-color="#090912"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#c9a7ff" stop-opacity=".22"/>
    <stop offset=".62" stop-color="#a88bcf" stop-opacity=".08"/>
    <stop offset="1" stop-color="#a88bcf" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ead9ff"/>
    <stop offset=".48" stop-color="#b99add"/>
    <stop offset="1" stop-color="#806b9f"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#c9a7ff" stroke-opacity=".075" stroke-width="1"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="1280" height="320" fill="url(#background)"/>
<rect width="1280" height="320" fill="url(#grid)"/>
<circle cx="1000" cy="148" r="190" fill="url(#halo)" filter="url(#soft)"/>
<circle cx="1000" cy="148" r="91" fill="url(#orb)" opacity=".92"/>
<circle cx="1037" cy="116" r="86" fill="#11101b"/>
<circle cx="1000" cy="148" r="108" fill="none" stroke="#c9a7ff" stroke-opacity=".24"/>
<circle cx="1000" cy="148" r="124" fill="none" stroke="#efaddc" stroke-opacity=".13" stroke-dasharray="2 9"/>
<path d="M0 252H250L278 224H414M1280 238H1118L1088 208H1060" fill="none" stroke="#c9a7ff" stroke-opacity=".38"/>
<path d="M0 64H146L170 88H220M1280 70H1160L1138 92H1100" fill="none" stroke="#efaddc" stroke-opacity=".45"/>
<circle cx="250" cy="252" r="2.5" fill="#efaddc"/>
<circle cx="414" cy="224" r="2.5" fill="#c9a7ff"/>
