  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#252525" stroke-width="1"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#050505" stop-opacity=".1"/><stop offset=".5" stop-color="#050505" stop-opacity=".06"/><stop offset="1" stop-color="#050505" stop-opacity=".72"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="16" fill="url(#bg)"/>
<rect width="1200" height="360" rx="16" fill="url(#grid)" opacity=".82"/>
